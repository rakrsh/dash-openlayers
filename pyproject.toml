[project]
name = "dash-openlayers"
version = "0.0.1"
description = "A Dash wrapper around OpenLayers - GIS rendering engine"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Ravi Sharma", email = "ravikr731@gmail.com" }]
requires-python = ">=3.10"
dependencies = ["dash>=2.0.0"]
classifiers = [
    "Framework :: Dash",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: GIS",
]

[project.urls]
Homepage = "https://github.com/rakrsh/dash-openlayers"
Issues = "https://github.com/rakrsh/dash-openlayers/issues"

[dependency-groups]
test = [
    "pytest>=8.3.0",
    "pytest-cov>=6.1.0",
    "coverage>=7.6.0",
    "dash[testing]>=2.18.0",
    "chromedriver-autoinstaller>=0.6.0",
]
build = [
    "build>=1.2.0",
]
lint = [
    "ruff>=0.8.0",
    "pre-commit>=4.0.0; python_version >= '3.9'",
]
dev = [
    { include-group = "test" },
    { include-group = "build" },
    { include-group = "lint" },
]
docs = [
    "mkdocs>=1.6.0",
    "mkdocs-material>=9.5.0",
    "mike>=2.1.0",
    "mkdocs-mermaid2-plugin>=1.1.0",
    "pymdown-extensions>=10.12.0",
]

[tool.uv]
default-groups = ["dev"]

[tool.ruff]
line-length = 100
target-version = "py38"
extend-exclude = ["dash_openlayers", "dash_openlayers.egg-info"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["dash_openlayers"]
include-package-data = true

[tool.setuptools.package-data]
dash_openlayers = ["*.js", "*.json"]
