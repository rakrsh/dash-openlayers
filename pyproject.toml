[project]
name = "dash-openlayers"
version = "0.0.1"
description = "A Dash wrapper around OpenLayers - GIS rendering engine"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Ravi Sharma", email = "ravikr731@gmail.com" }]
requires-python = ">=3.8"
dependencies = ["dash>=2.0.0"]
classifiers = [
    "Framework :: Dash",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: GIS",
]

[project.urls]
Homepage = "https://github.com/rakrsh/dash-openlayers"
Issues = "https://github.com/rakrsh/dash-openlayers/issues"

[dependency-groups]
test = ["pytest>=8.0.0"]
build = ["build>=1.0.0"]
lint = ["ruff>=0.6.0", "pre-commit>=3.8.0; python_version >= '3.9'"]
dev = [
    { include-group = "test" },
    { include-group = "build" },
    { include-group = "lint" },
]

[tool.uv]
default-groups = ["dev"]

[tool.ruff]
line-length = 100
target-version = "py38"
extend-exclude = ["dash_openlayers", "dash_openlayers.egg-info"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["dash_openlayers"]
include-package-data = true

[tool.setuptools.package-data]
dash_openlayers = ["*.js", "*.json"]
