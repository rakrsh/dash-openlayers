name: Prechecked dependency updates

on:
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * *"

concurrency:
  group: dependency-precheck
  cancel-in-progress: false

permissions:
  actions: write
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ecosystem: [npm, python]
    steps:
      - name: Check out main
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ vars.NODE_VERSION }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ vars.PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: ${{ vars.UV_VERSION }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update npm dependencies
        if: matrix.ecosystem == 'npm'
        run: |
          npx --yes npm-check-updates@18.0.3 --upgrade
          npm install

      - name: Update Python dependencies
        if: matrix.ecosystem == 'python'
        run: uv lock --upgrade

      - name: Install npm dependencies from the lockfile
        run: npm ci

      - name: Install all Python dependency groups
        run: uv sync --all-groups --locked

      - name: Build bundles, wrappers, and API docs
        run: npm run build

      - name: Run JavaScript lint
        run: npm run lint

      - name: Run JavaScript tests
        run: npm test

      - name: Run pre-commit checks
        run: uv run pre-commit run --all-files

      - name: Install browser for integration tests
        run: |
          sudo apt-get update
          sudo apt-get install -y chromium-browser chromium-chromedriver

      - name: Run Python unit tests
        run: uv run pytest -q tests/unit --cov=dash_openlayers --cov-report=term --cov-fail-under=80

      - name: Run Python integration tests
        run: xvfb-run -s "-screen 0 1280x1024x24" uv run pytest -q tests/integration

      - name: Build documentation
        run: uv run mkdocs build --strict

      - name: Build Python distributions
        run: uv build

      - name: Audit dependency vulnerabilities and licenses
        run: |
          npm audit --audit-level=high
          uv audit
          npx @onebeyond/license-checker scan --failOn AGPL-1.0-or-later AGPL-3.0-only GPL-3.0-only SSPL-1.0 --ignoreRootPackageLicense

      - name: Create dependency pull request
        id: create-pr
        uses: peter-evans/create-pull-request@v7
        with:
          branch: automated/dependencies-${{ matrix.ecosystem }}
          base: main
          title: "chore(deps): update ${{ matrix.ecosystem }} dependencies"
          commit-message: "chore(deps): update ${{ matrix.ecosystem }} dependencies"
          body: |
            This grouped dependency update was opened after the build, tests, and audits passed.

            The repository's regular CI workflows are dispatched after the PR is created.
          labels: |
            dependencies
            automated-pr

      - name: Dispatch regular pull request checks
        if: steps.create-pr.outputs.pull-request-operation == 'created' || steps.create-pr.outputs.pull-request-operation == 'updated'
        env:
          GH_TOKEN: ${{ github.token }}
          UPDATE_BRANCH: ${{ steps.create-pr.outputs.pull-request-branch }}
        run: |
          gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref "$UPDATE_BRANCH"
          gh workflow run ai-quality-gate.yml --repo "$GITHUB_REPOSITORY" --ref "$UPDATE_BRANCH"
          gh workflow run security.yml --repo "$GITHUB_REPOSITORY" --ref "$UPDATE_BRANCH"
