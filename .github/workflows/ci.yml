name: CI

on:
  workflow_dispatch:
  push:
    branches: [main, release/**]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ vars.NODE_VERSION }}
      - name: Install npm deps
        run: npm install
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ vars.PYTHON_VERSION }}
      - uses: pre-commit/action@v3.0.1

  frontend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ vars.NODE_VERSION }}
      - name: Install npm deps
        run: npm ci
      - name: Run frontend tests with coverage
        run: npm test

  build-matrix:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ vars.NODE_VERSION}}
      - name: Install npm deps
        run: npm install
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: ${{ vars.UV_VERSION }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Build JS bundles
        run: npm run build
      # Tests are executed by a reusable workflow (see test-suite.yml)

  build:
    needs: [build-matrix, frontend-tests]
    runs-on: ubuntu-latest
    steps:
      - name: Confirm build matrix succeeded
        run: echo "All build matrix jobs passed."

  test:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
    uses: ./.github/workflows/test-suite.yml
    with:
      os: ${{ matrix.os }}
      python-version: ${{ matrix.python-version }}
      node-version: ${{ vars.NODE_VERSION }}
      uv-version: ${{ vars.UV_VERSION }}

  package:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ vars.NODE_VERSION }}
      - name: Install npm deps
        run: npm install
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ vars.PYTHON_VERSION }}
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: ${{ vars.UV_VERSION }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Build JS bundles and Python components
        run: npm run build
      - name: Build wheel and sdist
        run: uv build
      - name: Verify clean-environment install
        run: |
          uv venv .venv-check
          uv pip install --python .venv-check dist/*.whl
          .venv-check/bin/python -c "import dash_openlayers; print(dash_openlayers.__version__)"
      - name: Upload dist artifact
        uses: actions/upload-artifact@v7
        with:
          name: dash-openlayers-dist
          path: dist/
