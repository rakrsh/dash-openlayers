name: CI

on:
  workflow_dispatch:
  push:
    branches: [ main, release/** ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ vars.NODE_VERSION }}
      - name: Install npm deps
        run: npm install
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ vars.PYTHON_VERSION }}
      - uses: pre-commit/action@v3.0.1

  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ vars.NODE_VERSION}}
      - name: Install npm deps
        run: npm install
      - name: Build JS bundles
        run: npm run build
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: ${{ vars.UV_VERSION }}

      - name: Install browser & chromedriver (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y chromium-browser chromium-chromedriver

      - name: Install browser & chromedriver (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          choco install -y googlechrome chromedriver

      - name: Install Python deps for tests
        run: |
          uv sync --groups test || uv sync test || true

      - name: Run unit tests
        run: uv run pytest -q tests/unit

      - name: Run integration tests
        run: |
          if [ "${{ matrix.os }}" = "ubuntu-latest" ]; then
            xvfb-run -s "-screen 0 1280x1024x24" uv run pytest -q tests/integration
          else
            uv run pytest -q tests/integration
          fi

  package:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ vars.NODE_VERSION }}
      - name: Install npm deps
        run: npm install
      - name: Build JS bundles
        run: npm run build
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ vars.PYTHON_VERSION }}
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: ${{ vars.UV_VERSION }}
      - name: Build wheel and sdist
        run: uv build
      - name: Verify clean-environment install
        run: |
          uv venv .venv-check
          uv pip install --python .venv-check dist/*.whl
          .venv-check/bin/python -c "import dash_openlayers; print(dash_openlayers.__version__)"
      - name: Upload dist artifact
        uses: actions/upload-artifact@v7
        with:
          name: dash-openlayers-dist
          path: dist/
