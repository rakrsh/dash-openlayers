name: Test Suite (reusable)

on:
  workflow_call:
    inputs:
      os:
        required: true
        type: string
      python-version:
        required: true
        type: string
      node-version:
        required: true
        type: string
      uv-version:
        required: true
        type: string

jobs:
  run-tests:
    runs-on: ${{ inputs.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node-version }}

      - name: Install npm deps
        run: npm install

      - name: Build JS bundles
        run: npm run build

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ inputs.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: ${{ inputs.uv-version }}

      - name: Install browser & chromedriver (Linux)
        if: startsWith(runner.os, 'Linux')
        run: |
          sudo apt-get update
          sudo apt-get install -y chromium-browser chromium-chromedriver

      - name: Install browser & chromedriver (Windows)
        if: startsWith(runner.os, 'Windows')
        shell: pwsh
        run: |
          choco install -y googlechrome chromedriver

      - name: Install Python deps for tests
        run: |
          uv sync --groups test || uv sync test || true

      - name: Run unit tests
        run: uv run pytest -q tests/unit

      - name: Run integration tests (Linux uses xvfb)
        if: startsWith(runner.os, 'Linux')
        run: xvfb-run -s "-screen 0 1280x1024x24" uv run pytest -q tests/integration

      - name: Run integration tests (Windows)
        if: startsWith(runner.os, 'Windows')
        shell: pwsh
        run: uv run pytest -q tests/integration
