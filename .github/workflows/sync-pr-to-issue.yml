name: Sync PR details to referenced issues

on:
  pull_request:
    types: [opened, edited, reopened]

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
      - name: Sync PR to referenced issues
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const pr = context.payload.pull_request;
            if (!pr) return;
            const body = pr.body || '';

            // Regex to find issue references (e.g., Fixes #123, Closes #123, Related #123)
            const issueNums = new Set();
            const refRegex = /(Fixes|fixes|Closes|closes|Related issue|Related issues|Related)\s*[:]?\s*#?(\d+)/g;
            let m;
            while ((m = refRegex.exec(body))) {
              issueNums.add(Number(m[2]));
            }

            if (issueNums.size === 0) return;

            // Extract Acceptance Criteria section from PR body if present
            function extractSection(text, heading) {
              const rx = new RegExp(`##\\s*${heading}([\s\S]*?)(##|$)`, 'i');
              const match = text.match(rx);
              return match ? match[1].trim() : '';
            }

            const ac = extractSection(body, 'Acceptance Criteria');

            for (const issueNumber of issueNums) {
              // Add a comment linking the PR and copying acceptance criteria
              const commentBodyParts = [];
              commentBodyParts.push(`This issue is referenced by PR #${pr.number}: ${pr.html_url}`);
              if (ac) {
                commentBodyParts.push('\n**Acceptance Criteria (from PR):**\n' + ac);
              }

              // Post comment
              await github.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                body: commentBodyParts.join('\n\n')
              });

              // Fetch issue to inspect labels
              const { data: issue } = await github.issues.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
              });

              const isBug = (issue.labels || []).some(l => (l.name || '').toLowerCase() === 'bug');

              // Update issue body to add or update a 'Linked PRs' / 'Fixed in' section
              let newBody = issue.body || '';
              const linkedSectionHeader = isBug ? 'Fixed in' : 'Linked PRs';
              const prLine = `- PR [#${pr.number}](${pr.html_url})`;

              // If header exists, append PR line if missing
              const headerRx = new RegExp(`##\\s*${linkedSectionHeader}`, 'i');
              if (headerRx.test(newBody)) {
                if (!newBody.includes(prLine)) {
                  newBody = newBody.replace(headerRx, match => match + '\n\n' + prLine);
                }
              } else {
                newBody = newBody + `\n\n## ${linkedSectionHeader}\n\n${prLine}\n`;
              }

              // Update the issue body
              await github.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                body: newBody,
              });
            }
