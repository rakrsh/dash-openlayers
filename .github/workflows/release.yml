name: Release

on:
  release:
    types: [published, prereleased]  # Triggers on standard & pre-release publications

jobs:
  publish:
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # Required for PyPI OIDC
      contents: read   # Required for repo checkout

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ vars.NODE_VERSION || '20' }}

      - name: Install npm deps
        run: npm ci

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ vars.PYTHON_VERSION || '3.11' }}

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: ${{ vars.UV_VERSION || 'latest' }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build JS bundles and Python components
        run: npm run build

      - name: Install Python quality-gate dependencies
        run: uv sync --group docs

      - name: Run release quality gates
        run: |
          npm test
          npm run lint
          node scripts/check-ai-invariants.js
          uv run pytest -q tests/unit
          uv run ruff check .
          uv run mkdocs build --strict

      - name: Verify release tag and package versions
        run: |
          uv run python scripts/check_release_metadata.py "${{ github.event.release.tag_name }}"

      - name: Build wheel and sdist
        run: uv build

      - name: Verify clean-environment install
        run: |
          uv venv .venv-check
          uv pip install --python .venv-check dist/*.whl
          cd "$RUNNER_TEMP"
          "$GITHUB_WORKSPACE/.venv-check/bin/python" "$GITHUB_WORKSPACE/scripts/check_installed_package.py"

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
