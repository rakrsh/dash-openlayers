name: Validate templates

on:
  push:
    paths:
      - '.github/**'
  pull_request:
    paths:
      - '.github/**'

jobs:
  validate-templates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check templates exist
        run: |
          if [ ! -f .github/ISSUE_TEMPLATE/issue_template.md ]; then
            echo "Missing .github/ISSUE_TEMPLATE/issue_template.md"; exit 1
          fi
          if [ ! -f .github/pull_request_template.md ]; then
            echo "Missing .github/pull_request_template.md"; exit 1
          fi
          echo "Templates present"
