name: Build and deploy versioned documentation
permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  release:
    types: [ published ]

jobs:
  build-and-deploy:
    if: ${{ github.event_name != 'release' || !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    concurrency:
      group: docs-deploy
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ vars.PYTHON_VERSION || '3.11' }}

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: ${{ vars.UV_VERSION }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install docs dependencies from pyproject
        run: |
          uv sync --group docs

      - name: Configure git remote for pushing
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git

      - name: Deploy docs (dev on main, versioned on release)
        env:
          REPO: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "Deploying dev docs"
            uv run mike deploy dev --push --branch=gh-pages
          fi

          if [ "${{ github.event_name }}" = "release" ]; then
            TAG_NAME="$GITHUB_REF_NAME"
            VERSION=${TAG_NAME#v}
            MAJMIN=$(echo "$VERSION" | awk -F. '{print $1"."$2}')

            echo "Deploying version: $VERSION and major.minor alias: $MAJMIN"
            uv run mike deploy "$VERSION" --push --branch=gh-pages
            uv run mike alias "$VERSION" "$MAJMIN" latest --push --branch=gh-pages
            uv run mike set-default latest --push --branch=gh-pages
          fi
