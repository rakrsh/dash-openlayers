version: 2
updates:
  # Node.js Ecosystem
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "daily"
      time: "02:00"
    # Keep the ecosystem enabled for native security updates only.
    open-pull-requests-limit: 0
    labels:
      - "dependencies"
      - "security"
      - "automated-pr"
    commit-message:
      prefix: "chore(deps)"

  # Python Ecosystem
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "daily"
      time: "02:00"
    # Keep the ecosystem enabled for native security updates only.
    open-pull-requests-limit: 0
    labels:
      - "dependencies"
      - "security"
      - "automated-pr"
    commit-message:
      prefix: "chore(deps-python)"
